services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hospitality
      POSTGRES_USER: hospitality
      POSTGRES_PASSWORD: hospitality
    ports: ["5432:5432"]
    volumes: [hospitality-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospitality -d hospitality"]
      interval: 5s
      timeout: 3s
      retries: 10
  hospitality:
    build: .
    environment:
      DATABASE_URL: postgres://hospitality:hospitality@postgres:5432/hospitality
      HOSPITALITY_ENV: development
      HOSPITALITY_SECRET_KEY: local-development-key
      HOSPITALITY_ADMIN_API_KEY: local-admin-key
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  hospitality-postgres:
